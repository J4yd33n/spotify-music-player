<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Spotify-inspired music player widget.">
  <title>Spotify Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <nav class="player" id="player" aria-label="Music player">
      <div class="drag-handle" title="Drag player">
        <img class="logo" draggable="false"
             src="https://upload.wikimedia.org/wikipedia/commons/2/26/Spotify_logo_with_text.svg"
             alt="Spotify">
      </div>

      <hr class="hr1">

      <div class="navigation">
        <button class="pages active" type="button" data-section="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 22V7.174l-9.001-5.195L3 7.214V22h7v-7h4v7z"/></svg>
          <span>Home</span>
        </button>

        <button class="pages" type="button" data-section="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.736 16.262A8.457 8.457 0 0019 10.5a8.5 8.5 0 10-3.779 7.067l4.424 5.18 1.521-1.299-4.43-5.186zM10.5 17C6.916 17 4 14.084 4 10.5S6.916 4 10.5 4 17 6.916 17 10.5 14.084 17 10.5 17z"/></svg>
          <span>Search</span>
        </button>

        <button class="pages" type="button" data-section="Your Library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.617 3.893l-1.827.814 7.797 17.513 1.827-.813-7.797-17.514zM3 22h2V4H3v18zm5 0h2V4H8v18z"/></svg>
          <span>Your Library</span>
        </button>

        <button class="pages" type="button" data-section="Favorite Songs">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.764 2.727a4.057 4.057 0 00-5.488-.253.558.558 0 01-.31.112.531.531 0 01-.311-.112 4.054 4.054 0 00-5.487.253A4.05 4.05 0 00.974 5.61c0 1.089.424 2.113 1.168 2.855l4.462 5.223a1.791 1.791 0 002.726 0l4.435-5.195A4.052 4.052 0 0014.96 5.61a4.057 4.057 0 00-1.196-2.883zm-.722 5.098L8.58 13.048c-.307.36-.921.36-1.228 0L2.864 7.797a3.072 3.072 0 01-.905-2.187c0-.826.321-1.603.905-2.187a3.091 3.091 0 012.191-.913 3.05 3.05 0 011.957.709c.041.036.408.351.954.351a3.075 3.075 0 014.161.192 3.1 3.1 0 01-.025 4.403z"/></svg>
          <span>Favorite Songs</span>
        </button>
      </div>

      <hr class="hr2">

      <section class="list" aria-label="Songs">
        <button class="song-card" type="button"
          data-title="Darmaduman" data-artist="Duman"
          data-cover="https://upload.wikimedia.org/wikipedia/tr/4/47/Darmaduman.jpg">
          <img src="https://upload.wikimedia.org/wikipedia/tr/4/47/Darmaduman.jpg" alt="Darmaduman album cover" loading="lazy">
          <strong>Darmaduman</strong>
          <span>Duman</span>
        </button>

        <button class="song-card" type="button"
          data-title="Akıyor Zaman" data-artist="Seksendört"
          data-cover="https://s1.dmcdn.net/v/1lMiI1Vju2e6lOdea/x1080">
          <img src="https://s1.dmcdn.net/v/1lMiI1Vju2e6lOdea/x1080" alt="Akıyor Zaman album cover" loading="lazy">
          <strong>Akıyor Zaman</strong>
          <span>Seksendört</span>
        </button>

        <button class="song-card" type="button"
          data-title="Karanlık" data-artist="Dolu Kadehi Ters Tut"
          data-cover="https://productimages.hepsiburada.net/s/58/500/11321560236082.jpg">
          <img src="https://productimages.hepsiburada.net/s/58/500/11321560236082.jpg" alt="Karanlık album cover" loading="lazy">
          <strong>Karanlık</strong>
          <span>Dolu Kadehi Ters Tut</span>
        </button>

        <button class="song-card" type="button"
          data-title="Şehr-i Hüzün" data-artist="Manga"
          data-cover="https://e.snmc.io/i/600/w/7260a264252c939c4c22625e80ef17ca/3597494">
          <img src="https://e.snmc.io/i/600/w/7260a264252c939c4c22625e80ef17ca/3597494" alt="Şehr-i Hüzün album cover" loading="lazy">
          <strong>Şehr-i Hüzün</strong>
          <span>Manga</span>
        </button>

        <button class="song-card" type="button"
          data-title="Gülümse" data-artist="Sezen Aksu"
          data-cover="https://e.snmc.io/i/600/w/7260a264252c939c4c22625e80ef17ca/3597494">
          <img src="https://e.snmc.io/i/600/w/7260a264252c939c4c22625e80ef17ca/3597494" alt="Gülümse album cover" loading="lazy">
          <strong>Gülümse</strong>
          <span>Sezen Aksu</span>
        </button>
      </section>

      <hr class="hr3">

      <section class="play" aria-label="Now playing">
        <img id="currentCover"
             src="https://images.genius.com/85ca59e3f357de96d3da68b860a14579.960x960x1.jpg"
             alt="Current song cover">

        <div class="container">
          <p class="songName" id="songName">#22</p>
          <p class="name" id="artistName">Dolu Kadehi Ters Tut</p>

          <div class="timeline" aria-label="Track progress">
            <span id="currentTime">0:00</span>
            <button class="progress" id="progress" type="button" aria-label="Track progress">
              <span id="progressFill"></span>
            </button>
            <span id="duration">3:31</span>
          </div>

          <div class="controls">
            <button type="button" class="icon-btn" id="previousBtn" aria-label="Previous song">
              <svg viewBox="0 0 16 16"><path d="M13 2.5L5 7.119V3H3v10h2V8.881l8 4.619z"/></svg>
            </button>
            <button type="button" class="play-btn" id="playBtn" aria-label="Play">
              <svg id="playIcon" viewBox="0 0 16 16"><path d="M4.018 14L14.41 8 4.018 2z"/></svg>
            </button>
            <button type="button" class="icon-btn" id="nextBtn" aria-label="Next song">
              <svg viewBox="0 0 16 16"><path d="M11 3v4.119L3 2.5v11l8-4.619V13h2V3z"/></svg>
            </button>
          </div>
        </div>
      </section>
    </nav>
  </main>

  <script src="main.js"></script>
</body>
</html>
